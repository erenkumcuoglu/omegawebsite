<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omega Digital — Oyun Kodları, Kuponlar ve Dijital Üyelikler</title>
    <meta name="description" content="PUBG Mobile UC, Valorant Points, Steam, PSN, Google Play ve daha fazlası. Anında teslimat ve güvenli ödeme ile dijital kod mağazası." />
    <meta property="og:title" content="Omega Digital" />
    <meta property="og:description" content="Oyun kodları, kuponlar ve dijital üyelikler tek sepette. Anında teslimat, güvenli ödeme." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Netlify Forms algılaması için statik form (görünmez). JS içindeki destek formu buraya POST eder. -->
    <form name="destek" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="app"></div>
    <script src="./app.js"></script>
  </body>
</html>
