<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>forms</title></head>
<body>
<!-- Netlify Forms reads this static file at deploy time; the support form in the footer posts here. -->
<form name="support" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field" />
  <input type="email" name="email" />
  <input type="text" name="locale" />
  <textarea name="message"></textarea>
</form>
</body></html>
